# /etc/nginx/sites-available/onlydeals
# Public face of onlydeals: serves the SPA and proxies the DB-backed feed +
# admin DB API to the feed service (127.0.0.1:8788).

server {
    listen 80;
    server_name deals.your-domain.com;   # ← change to your domain

    # ---- the public site (vite build output) ----
    root /var/www/onlydeals;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA + the /adminn route
    }

    # ---- the feed: FEED_URL = https://deals.your-domain.com/onlydeals.json ----
    # Proxied to the feed service, which reads Postgres. CORS is added there.
    location = /onlydeals.json {
        proxy_pass http://127.0.0.1:8788/onlydeals.json;
        proxy_set_header Host $host;
    }

    # ---- admin DB API (Control Room Database page) ----
    # Protected by x-api-key inside the service; never exposes credentials.
    location /api/db/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:8788/api/health;
        proxy_set_header Host $host;
    }

    # ---- static n8n workflow library ----
    location /workflows/ {
        alias /var/www/onlydeals/workflows/;
        add_header Cache-Control "no-store";
    }
}

# When you have certbot:
#   certbot --nginx -d deals.your-domain.com
# and it will add the 443 block + redirect for you.
