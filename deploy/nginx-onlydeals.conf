# /etc/nginx/sites-available/onlydeals
# Public face of onlydeals: serves the SPA, the feed JSON (what FEED_URL
# points at) and proxies /ingest to the Node service.

server {
    listen 80;
    server_name deals.your-domain.com;   # ← change to your domain

    # ---- the public site (vite build output) ----
    root /var/www/onlydeals;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;   # SPA + the /adminn route
    }

    # ---- the feed: FEED_URL = https://deals.your-domain.com/onlydeals.json ----
    # Served straight off disk; CORS is mandatory — the browser fetches it.
    location = /onlydeals.json {
        alias /var/lib/onlydeals/onlydeals.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the ingest endpoint: OFFRADAR_INGEST_URL = https://deals.your-domain.com/ingest ----
    location /ingest {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 4m;
    }

    # ---- static assets from the n8n workflow library ----
    location /workflows/ {
        alias /var/www/onlydeals/workflows/;
        add_header Cache-Control "no-store";
    }
}

# When you have certbot:
#   certbot --nginx -d deals.your-domain.com
# and it will add the 443 block + redirect for you.
